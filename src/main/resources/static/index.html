<!doctype html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Battery ROI simulator</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
	<style>
		fieldset { margin-bottom: 1.5rem; }
		.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
		@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
		#results table th.value-col, #results table td.num { text-align: right; }
		#results table td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
		tbody.group tr:first-child th { padding-top: 1.25rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--pico-muted-color); }
		#status article[role="alert"] { border-left: 4px solid var(--pico-del-color); }
	</style>
</head>
<body>
<main class="container">
	<h1>Battery ROI simulator</h1>
	<p>Upload a year of 15-minute smart-meter readings, pick a battery spec and your tariffs, and see what the grid bill would have looked like with a home battery inline.</p>

	<form id="calcForm">
		<fieldset>
			<legend><strong>CSV</strong></legend>
			<label>
				Smart-meter readings (CSV)
				<input type="file" name="csv" accept=".csv,text/csv" required>
				<small>Columns: time, Import T1/T2 kWh, Export T1/T2 kWh, L1/L2/L3 max W.</small>
			</label>
		</fieldset>

		<fieldset>
			<legend><strong>Battery</strong></legend>
			<div class="grid-2">
				<label>Max capacity (kWh)
					<input type="number" name="maxCapacity" value="5.12" step="0.01" min="0" required>
				</label>
				<label>Price (EUR)
					<input type="number" name="price" value="1099" step="1" min="0" required>
				</label>
				<label>Max percent (%)
					<input type="number" name="maxPercent" value="100" step="1" min="0" max="100" required>
				</label>
				<label>Min percent (%)
					<input type="number" name="minPercent" value="10" step="1" min="0" max="100" required>
				</label>
				<label>Max charge power (kW)
					<input type="number" name="maxChargePower" value="2.5" step="0.01" min="0" required>
				</label>
				<label>Max discharge power (kW)
					<input type="number" name="maxDischargePower" value="0.8" step="0.01" min="0" required>
				</label>
				<label>Round-trip efficiency (0–1)
					<input type="number" name="rte" value="0.82" step="0.01" min="0" max="1" required>
				</label>
			</div>
		</fieldset>

		<fieldset>
			<legend><strong>Tariffs</strong></legend>
			<div class="grid-2">
				<label>Import T1 (EUR/kWh)
					<input type="number" name="importT1" value="0.23236" step="0.00001" min="0" required>
				</label>
				<label>Import T2 (EUR/kWh)
					<input type="number" name="importT2" value="0.23236" step="0.00001" min="0" required>
				</label>
				<label>Export T1 (EUR/kWh)
					<input type="number" name="exportT1" value="0.02" step="0.00001" min="0" required>
				</label>
				<label>Export T2 (EUR/kWh)
					<input type="number" name="exportT2" value="0.02" step="0.00001" min="0" required>
				</label>
			</div>
		</fieldset>

		<button id="submitBtn" type="submit">Calculate</button>
	</form>

	<section id="status" hidden></section>

	<section id="results" hidden>
		<h2>Results</h2>
		<table>
			<thead>
				<tr><th scope="col">Metric</th><th scope="col" class="value-col">Value</th></tr>
			</thead>
			<tbody id="resultsBody"></tbody>
		</table>
	</section>
</main>

<script>
	const BATTERY_FIELDS = ['maxCapacity', 'maxPercent', 'minPercent', 'maxChargePower', 'maxDischargePower', 'rte', 'price'];
	const TARIFF_FIELDS = ['importT1', 'importT2', 'exportT1', 'exportT2'];

	const GROUPS = [
		{ title: 'Grid flows', rows: [
			['intervalsParsed', 'Intervals parsed', 'int'],
			['homeImportKwh', 'Home import (kWh)', 'kwh'],
			['homeExportKwh', 'Home export (kWh)', 'kwh'],
			['netImportKwh', 'Net import with battery (kWh)', 'kwh'],
			['netExportKwh', 'Net export with battery (kWh)', 'kwh'],
		]},
		{ title: 'Battery', rows: [
			['usableCapacityKwh', 'Usable capacity (kWh)', 'kwh'],
			['finalChargeKwh', 'Final charge (kWh)', 'kwh'],
			['totalChargedKwh', 'Total charged (kWh)', 'kwh'],
			['totalDischargedKwh', 'Total discharged (kWh)', 'kwh'],
			['equivalentFullCycles', 'Equivalent full cycles', 'num2'],
		]},
		{ title: 'Money', rows: [
			['costNoBattery', 'Cost without battery (EUR)', 'eur'],
			['costWithBattery', 'Cost with battery (EUR)', 'eur'],
			['periodSavings', 'Period savings (EUR)', 'eur'],
			['annualSavings', 'Annual savings (EUR)', 'eur'],
			['batteryPrice', 'Battery price (EUR)', 'eur'],
		]},
		{ title: 'ROI', rows: [
			['periodYears', 'Period length (years)', 'num2'],
			['roiYears', 'ROI (years)', 'roi'],
		]},
	];

	const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
	const nfInt = new Intl.NumberFormat('en-US');

	function formatValue(kind, v) {
		if (kind === 'roi') return v === -1 ? 'Never (no savings)' : nf2.format(v) + ' years';
		if (kind === 'int') return nfInt.format(v);
		return nf2.format(v);
	}

	function readNumbers(form, names) {
		const out = {};
		for (const n of names) out[n] = Number(form.elements[n].value);
		return out;
	}

	function jsonPart(obj) {
		return new Blob([JSON.stringify(obj)], { type: 'application/json' });
	}

	function renderResults(data) {
		const body = document.getElementById('resultsBody');
		body.innerHTML = '';
		for (const group of GROUPS) {
			const tbody = document.createElement('tbody');
			tbody.className = 'group';
			const headRow = document.createElement('tr');
			const headCell = document.createElement('th');
			headCell.colSpan = 2;
			headCell.scope = 'colgroup';
			headCell.textContent = group.title;
			headRow.appendChild(headCell);
			tbody.appendChild(headRow);
			for (const [key, label, kind] of group.rows) {
				const tr = document.createElement('tr');
				const th = document.createElement('th');
				th.scope = 'row';
				th.textContent = label;
				const td = document.createElement('td');
				td.className = 'num';
				td.textContent = formatValue(kind, data[key]);
				tr.appendChild(th);
				tr.appendChild(td);
				tbody.appendChild(tr);
			}
			body.appendChild(tbody);
		}
		document.getElementById('results').hidden = false;
	}

	function showError(message) {
		const status = document.getElementById('status');
		status.innerHTML = '';
		const article = document.createElement('article');
		article.setAttribute('role', 'alert');
		const h = document.createElement('strong');
		h.textContent = 'Request failed';
		const p = document.createElement('pre');
		p.style.whiteSpace = 'pre-wrap';
		p.style.marginTop = '0.5rem';
		p.textContent = message;
		article.appendChild(h);
		article.appendChild(p);
		status.appendChild(article);
		status.hidden = false;
	}

	function clearStatus() {
		const status = document.getElementById('status');
		status.innerHTML = '';
		status.hidden = true;
	}

	document.getElementById('calcForm').addEventListener('submit', async (event) => {
		event.preventDefault();
		const form = event.currentTarget;
		if (!form.reportValidity()) return;

		const btn = document.getElementById('submitBtn');
		btn.setAttribute('aria-busy', 'true');
		btn.disabled = true;
		clearStatus();

		try {
			const fd = new FormData();
			fd.append('csv', form.elements['csv'].files[0]);
			fd.append('battery', jsonPart(readNumbers(form, BATTERY_FIELDS)));
			fd.append('tariffs', jsonPart(readNumbers(form, TARIFF_FIELDS)));

			const response = await fetch('/calculate', { method: 'POST', body: fd });
			if (!response.ok) {
				const text = await response.text();
				showError(`HTTP ${response.status} ${response.statusText}\n\n${text}`);
				return;
			}
			const data = await response.json();
			renderResults(data);
		} catch (err) {
			showError(err.message || String(err));
		} finally {
			btn.removeAttribute('aria-busy');
			btn.disabled = false;
		}
	});
</script>
</body>
</html>
